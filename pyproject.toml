[project]
name = "discord-bot"
version = "1.0.0"
description = "A simple Discord bot"
authors = [{ name = "hex5e" }]
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.6.4",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
bot = "src.__main__:entry"
