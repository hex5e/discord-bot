[project]
name = "discord-bot"
version = "1.0.0"
description = "A Discord bot with modular architecture"
authors = [
    { name = "hex5e" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "discord.py==2.3.2",
    "python-dotenv==1.0.0",
    "python-jobspy==1.1.78"
]

[project.scripts]
start = "src.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
